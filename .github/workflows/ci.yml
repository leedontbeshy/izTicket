name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        name: Lint, Type Check & Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Create CI env
              run: |
                  printf 'DATABASE_URL=postgresql://ci:ci@localhost:5432/ci\n' >> apps/api/.env
                  printf 'JWT_SECRET=ci-secret-key-minimum-32-characters-long\n' >> apps/api/.env
            - run: pnpm run lint
            - run: pnpm run check-types
            - run: pnpm --filter api test
